name = "startup-intel"
main = "src/index.js"
compatibility_date = "2026-05-01"

[triggers]
crons = ["*/5 9 * * *", "0-35/5 10 * * *", "*/2 * * * *"]   # radar 09:00–09:20 UTC; private monitor 09:25–10:30; intel store 10:35; */2 = Prepare to Apply queue (src/prepare.js) — see src/index.js

[vars]
MONITOR_ENABLED = "all"   # "off" pauses the private job monitor

[[d1_databases]]
binding       = "DB"
database_name = "startup-intel"
database_id   = "e75c83bd-ed60-4698-9680-9ea5a5f9786e"
